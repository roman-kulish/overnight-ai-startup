<style>
 :root{--bg:#0e0f13;--panel:#16181f;--line:#262a35;--fg:#e6e8ee;--mut:#9aa3b2;--accent:#8ab4ff}
 *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
   font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
 #app{display:grid;grid-template-columns:1fr 400px;height:100vh}
 #cy{width:100%;height:100%}
 #side{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:18px}
 header{position:absolute;top:0;left:0;padding:14px 18px;z-index:5;pointer-events:none}
 h1{font-size:15px;margin:0;font-weight:650} .sub{color:var(--mut);font-size:12px;margin-top:2px}
 #bar{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:8px}
 #bar input,#bar select{background:var(--panel);border:1px solid var(--line);color:var(--fg);
   border-radius:8px;padding:8px 10px;outline:none;font-size:13px}
 #search{width:min(300px,32vw)}
 #legend{position:absolute;bottom:14px;left:18px;z-index:5;display:flex;flex-wrap:wrap;gap:6px;max-width:60vw}
 .chip{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
   border-radius:20px;padding:3px 10px;font-size:12px;color:var(--mut);cursor:pointer;user-select:none}
 .chip.off{opacity:.4} .dot{width:10px;height:10px;border-radius:50%}
 #side h2{font-size:17px;margin:.2em 0} .type{display:inline-block;border-radius:6px;padding:2px 8px;
   font-size:11px;font-weight:600;color:#0e0f13} .desc{color:var(--mut);margin:8px 0 12px}
 .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
 .tag{background:#1d2230;border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-size:11px;color:var(--mut)}
 .rel{margin:10px 0} .rel h4{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
 .rel a{display:block;color:var(--accent);cursor:pointer;font-size:13px;padding:1px 0;text-decoration:none}
 .rel a:hover{text-decoration:underline}
 .body{border-top:1px solid var(--line);padding-top:12px;margin-top:12px} .body table{border-collapse:collapse;display:block;overflow:auto}
 .body td,.body th{border:1px solid var(--line);padding:4px 8px} .body code{background:#1d2230;padding:1px 5px;border-radius:4px}
 .body pre{background:#1d2230;padding:10px;border-radius:8px;overflow:auto} .body img{max-width:100%}
 .empty{color:var(--mut)} a{color:var(--accent)}
 .src{pointer-events:auto;color:var(--accent);margin-left:10px;text-decoration:none} .src:hover{text-decoration:underline}
</style></head><body>
<div id="app"><div id="cy"></div><div id="side"><p class="empty">Click a concept to inspect it.</p></div></div>
<header><h1>vibe-coding/docs</h1><div class="sub">8 concepts · 0 links · OKF v0.1</div></header>
<div id="bar">
 <input id="search" placeholder="search concepts…">
 <select id="type"><option value="">all types</option></select>
 <select id="layout">
  <option value="cose">force</option><option value="concentric">concentric</option>
  <option value="breadthfirst">breadth-first</option><option value="circle">circle</option><option value="grid">grid</option>
 </select>
</div>
<div id="legend"></div>
<script>
const NODES=[{"id": "apps/agency-generator", "type": "App", "title": "AI Automation Agency Generator", "description": "Turn any mundane hobby into a fictional $10k/month AI agency blueprint", "tags": ["app", "agency", "satire", "parody"], "group": "apps", "sz": 27, "body": "# AI Automation Agency Generator\n\n## Concept\n\nA parody of the \"AI Automation Agency\" hustle gurus. Enter a mundane hobby and get a slick, 5-step business plan promising $10k/month.\n\n## Example\n\n- **Input**: `Goat walking`\n- **Output title**: \"B2B Caprine Asset Management\"\n- **The pitch**: Local hobby farmers are losing thousands in unoptimized goat grazing time. Your agency solves this using AI-driven autonomous orchestration.\n\n## Model\n\n`@cf/meta/llama-3.1-8b-instruct-fp8-fast` with fallback to `@cf/meta/llama-3.2-3b-instruct`.\n\n## Visuals\n\nCyberpunk-neon \"hustle bro\" dashboard with a fake revenue graph that rockets up and to the right."}, {"id": "apps/crypto-oracle", "type": "App", "title": "Crypto-Astrology Oracle", "description": "Explain crypto price action using astrology and zodiac signs", "tags": ["app", "crypto", "astrology", "oracle", "parody"], "group": "apps", "sz": 27, "body": "# Crypto-Astrology Oracle\n\n## Concept\n\nMerge two belief-driven systems: enter a zodiac sign and a crypto ticker, get a reading that explains the price action using astrology.\n\n## Example\n\n- **Input**: Leo + ETH\n- **Output**: \"Saturn is transiting your gas fees, creating massive spiritual resistance on the network. Whales are accumulating, but the cosmos are consolidating.\"\n\n## Data source\n\nCoinGecko free API for real-time crypto prices. Optional planetary ephemeris for realistic natal charts.\n\n## Model\n\n`@cf/meta/llama-3.1-8b-instruct-fp8-fast` with fallback to `@cf/meta/llama-3.2-3b-instruct`.\n\n## Visuals\n\nMystical star charts layered over stark financial graphs."}, {"id": "apps/meditate-shares", "type": "App", "title": "Meditate to Your Shares", "description": "Generate a sarcastic guided meditation based on a stock or crypto ticker's volatility", "tags": ["app", "finance", "meditation", "parody"], "group": "apps", "sz": 26, "body": "# Meditate to Your Shares\n\n## Concept\n\nA user enters a stock or crypto ticker. The app pulls recent price data and generates a guided meditation that breathes with the market's mood.\n\n## Example\n\n- **Input**: `TSLA`\n- **Output**: \"Breathe in... as your portfolio bleeds red. Breathe out... and release your attachment to earthly gains and the concept of retirement.\"\n\n## Data source\n\nYahoo Finance or equivalent free API for historical prices.\n\n## Model\n\n`@cf/meta/llama-3.2-3b-instruct` with fallback to `@cf/meta/llama-3.2-1b-instruct`."}, {"id": "apps/vc-roast", "type": "App", "title": "VC Roast Pitch Deck", "description": "Brutally roast a one-sentence billion-dollar AI idea", "tags": ["app", "vc", "roast", "pitch", "parody"], "group": "apps", "sz": 27, "body": "# VC Roast Pitch Deck\n\n## Concept\n\nSubmit a one-sentence \"billion-dollar AI idea\" and get a brutal roast in Silicon Valley venture-speak. A fake valuation counter ticks down to zero while you read.\n\n## Example\n\n- **Input**: \"An AI that reminds me to drink water.\"\n- **Output**: \"Pre-revenue, post-utility. You've reinvented the alarm clock but bolted an LLM to it. Your burn rate will outpace your user acquisition by Q2.\"\n\n## Model\n\n`@cf/mistralai/mistral-small-3.1-24b-instruct` for sharp wit, with fallback to `@cf/meta/llama-3.1-8b-instruct-fp8-fast`.\n\n## Visuals\n\nDark-mode pitch deck layout with a ticking valuation display."}, {"id": "architecture", "type": "Architecture", "title": "Architecture", "description": "Cloudflare-first architecture for the Vibe Coding dashboard", "tags": ["architecture", "cloudflare", "workers", "react"], "group": "(root)", "sz": 32, "body": "# Architecture\n\n## Stack\n\n| Layer | Technology |\n|-------|------------|\n| Frontend | React + Vite + TypeScript + Tailwind CSS |\n| Router | React Router v7 |\n| Backend | Cloudflare Workers |\n| LLM | Cloudflare Workers AI via AI Gateway |\n| Hosting | Cloudflare Workers static assets |\n| Domain | vibe-coding.shiretechpartners.com.au |\n\n## Structure\n\n```\nvibe-coding/\n\u251c\u2500\u2500 src/              # React frontend\n\u251c\u2500\u2500 worker/           # Cloudflare Worker API\n\u251c\u2500\u2500 docs/             # This OKF knowledge bundle\n\u251c\u2500\u2500 wrangler.jsonc    # Cloudflare configuration\n\u2514\u2500\u2500 README.md\n```\n\n## Routing\n\nEvery app is a route in the single-page application. The shared `AppShell` provides:\n\n- A prominent \"Return to Dashboard\" link at the top\n- A \"Buy Me a Coffee\" banner at the bottom\n\n## API\n\nEach app calls a dedicated Worker endpoint. The Worker is responsible for:\n\n1. Validating the request\n2. Checking for prompt injection\n3. Fetching external data if needed\n4. Calling the LLM through the appropriate AI Gateway\n5. Returning the generated content\n\n## AI Gateway strategy\n\nOne gateway per app keeps rate limits, budgets, and guardrails independent. The application code stays small because the gateway handles almost all traffic and cost protection.\n\n## Models\n\n| App | Primary model | Fallback |\n|-----|--------------|----------|\n| Meditate | `@cf/meta/llama-3.2-3b-instruct` | `@cf/meta/llama-3.2-1b-instruct` |\n| Agency | `@cf/meta/llama-3.1-8b-instruct-fp8-fast` | `@cf/meta/llama-3.2-3b-instruct` |\n| VC Roast | `@cf/mistralai/mistral-small-3.1-24b-instruct` | `@cf/meta/llama-3.1-8b-instruct-fp8-fast` |\n| Oracle | `@cf/meta/llama-3.1-8b-instruct-fp8-fast` | `@cf/meta/llama-3.2-3b-instruct` |\n\nModels are configurable through environment variables so they can be swapped without redeploying code."}, {"id": "deployment", "type": "Deployment", "title": "Deployment", "description": "How the Vibe Coding dashboard is built and deployed", "tags": ["deployment", "cloudflare", "wrangler"], "group": "(root)", "sz": 26, "body": "# Deployment\n\n## Requirements\n\n- Node.js 20+\n- Cloudflare account\n- Wrangler CLI authenticated\n\n## Local development\n\n```bash\nnpm install\nnpm run dev\n```\n\n## Deploy\n\n```bash\nnpm run deploy\n```\n\n## Environment variables\n\nSet these in Cloudflare or via Wrangler secrets:\n\n- `MODEL_MEDITATE`\n- `MODEL_AGENCY`\n- `MODEL_VC_ROAST`\n- `MODEL_ORACLE`\n\n## Domain\n\nThe site is deployed at `vibe-coding.shiretechpartners.com.au` with a Cloudflare-managed custom domain."}, {"id": "project", "type": "Project", "title": "Overnight AI Startup", "description": "A social experiment in vibe-coding AI startup parodies", "tags": ["project", "experiment", "ai", "satire"], "group": "(root)", "sz": 30, "body": "# Project\n\n## What\n\nA public web dashboard hosting four parody AI applications. Each app mocks a common YouTube \"overnight AI startup\" archetype by taking a silly input and producing a polished, deadpan AI-generated result.\n\n## Why\n\nThe project is the practical half of an essay about the YouTube AI money genre. The real business in that genre is rarely the AI product \u2014 it is the content about the AI product. This experiment turns the observation into a deployable joke.\n\n## Origin story\n\nSee the source story on Medium:\n\n[Mortgage vs. The Machine: Inside the YouTube \"Overnight AI Startup\" Grift](https://medium.com/@roman.kulish/mortgage-vs-the-machine-inside-the-youtube-overnight-ai-startup-grift-8b3833f24146)\n\n## The four apps\n\n1. **Meditate to Your Shares** \u2014 stock ticker \u2192 sarcastic guided meditation\n2. **AI Automation Agency Generator** \u2014 hobby \u2192 fake $10k/mo agency blueprint\n3. **VC Roast Pitch Deck** \u2014 idea \u2192 brutal VC-style roast\n4. **Crypto-Astrology Oracle** \u2014 zodiac + crypto ticker \u2192 astrological price reading\n\n## Site\n\nLive at \u003chttps://vibe-coding.shiretechpartners.com.au>.\n\n## Support\n\nIf the experiment fails to deliver a mortgage-free life, the author accepts coffee:\n\u003chttps://buymeacoffee.com/romanko>"}, {"id": "security", "type": "Security", "title": "Security Controls", "description": "Rate limiting, input validation, and cost controls for public-facing LLM apps", "tags": ["security", "ai-gateway", "rate-limiting", "validation"], "group": "(root)", "sz": 31, "body": "# Security Controls\n\nThis is a public-facing LLM application. Security is focused on cost control, abuse prevention, and keeping generated content safe.\n\n## Layer 1: AI Gateway\n\nEach app has its own AI Gateway that handles:\n\n- **Guardrails**: content moderation on prompts and responses\n- **Rate limiting**: per-gateway request limits\n- **Spend limits**: per-app daily/monthly dollar budgets\n- **Caching**: cached LLM responses for identical inputs\n\nThe gateway returns a `429 Too Many Requests` response when a limit is exceeded.\n\n## Layer 2: Application validation\n\nThe Worker validates every request before touching the gateway:\n\n- **Length limits** per app\n- **Format validation** with allow-listed patterns\n- **Control character stripping**\n- **Prompt injection pattern detection**\n- **Output length and content checks**\n\n## Layer 3: CAPTCHA\n\nCloudflare Turnstile appears after a threshold of rapid requests from the same IP.\n\n## Per-app rate limits\n\n| App | Per minute | Per hour | Per day |\n|-----|-----------|----------|---------|\n| Meditate | 5 | 50 | 200 |\n| Agency | 5 | 50 | 200 |\n| VC Roast | 3 | 30 | 100 |\n| Oracle | 5 | 50 | 200 |\n\n## Budgets\n\n| App | Daily | Monthly |\n|-----|-------|---------|\n| Meditate | $5 | $100 |\n| Agency | $5 | $100 |\n| VC Roast | $8 | $150 |\n| Oracle | $5 | $100 |\n\n## Validation rules\n\n- **Meditate**: ticker symbol, max 50 characters\n- **Agency**: hobby description, max 200 characters\n- **VC Roast**: idea pitch, max 500 characters\n- **Oracle**: zodiac + crypto, max 100 characters"}], EDGES=[];
const PALETTE=["#6E56CF","#D97757","#22C55E","#3B82F6","#EAB308","#EC4899","#14B8A6","#F97316","#A855F7","#0EA5E9","#84CC16","#EF4444","#64748B"];
const byId=Object.fromEntries(NODES.map(n=>[n.id,n]));
const outL={}, inL={};
NODES.forEach(n=>{outL[n.id]=[];inL[n.id]=[];});
EDGES.forEach(e=>{outL[e.source].push(e.target);inL[e.target].push(e.source);});
const types=[...new Set(NODES.map(n=>n.type))].sort();
const color=Object.fromEntries(types.map((t,i)=>[t,PALETTE[i%PALETTE.length]]));
const off=new Set();
const cy=cytoscape({container:document.getElementById('cy'),minZoom:.2,maxZoom:1.6,wheelSensitivity:.2,
 elements:[...NODES.map(n=>({data:{...n,c:color[n.type]}})),...EDGES.map(e=>({data:e}))],
 style:[
  {selector:'node',style:{'background-color':'data(c)','label':'data(title)','color':'#e6e8ee',
   'font-size':10,'text-wrap':'wrap','text-max-width':120,'text-valign':'bottom','text-margin-y':4,
   'text-outline-width':2,'text-outline-color':'#0e0f13','min-zoomed-font-size':6,
   'width':'data(sz)','height':'data(sz)'}},
  {selector:'edge',style:{'width':1.2,'line-color':'#3a4150','target-arrow-color':'#3a4150',
   'target-arrow-shape':'triangle','arrow-scale':.8,'curve-style':'bezier','opacity':.7}},
  {selector:'.dim',style:{'opacity':.10}},{selector:'.hl',style:{'border-width':3,'border-color':'#fff'}}
 ],
 layout:{name:'cose',animate:false,nodeRepulsion:9000,idealEdgeLength:90,padding:40}});
const side=document.getElementById('side');
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function relList(title,arr){if(!arr.length)return'';
 return `<div class="rel"><h4>${title}</h4>${arr.map(id=>`<a data-go="${esc(id)}">${esc((byId[id]||{}).title||id)}</a>`).join('')}</div>`;}
function show(id){const n=byId[id];if(!n)return;const c=color[n.type];
 side.innerHTML=`<span class="type" style="background:${c}">${esc(n.type)}</span>
 <h2>${esc(n.title)}</h2><div class="desc">${esc(n.description)||'<span class=empty>no description</span>'}</div>
 <div class="tags">${(n.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
 ${relList('Links to',outL[id])}${relList('Cited by',inL[id])}
 <div class="body">${n.body?marked.parse(n.body):'<span class=empty>empty body</span>'}</div>`;
 side.querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>select(a.getAttribute('data-go')));}
function select(id){const ele=cy.getElementById(id);if(!ele.length)return;show(id);
 cy.elements().removeClass('hl').addClass('dim');const nb=ele.closedNeighborhood();nb.removeClass('dim');ele.addClass('hl');
 cy.animate({center:{eles:ele},duration:250});
 try{if(decodeURIComponent((location.hash||'').slice(1))!==id)location.hash=encodeURIComponent(id);}catch(e){}}
cy.on('tap','node',e=>select(e.target.id()));
cy.on('tap',e=>{if(e.target===cy)cy.elements().removeClass('dim hl');});
function applyFilter(){const q=document.getElementById('search').value.toLowerCase();const ty=document.getElementById('type').value;
 cy.nodes().forEach(n=>{const d=n.data();
  const m=(!q||(d.title+' '+d.type+' '+d.description+' '+(d.tags||[]).join(' ')).toLowerCase().includes(q))
        &&(!ty||d.type===ty)&&!off.has(d.type);
  n.style('display',m?'element':'none');});}
document.getElementById('search').oninput=applyFilter;
document.getElementById('type').oninput=applyFilter;
const tysel=document.getElementById('type');types.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;tysel.appendChild(o);});
document.getElementById('layout').onchange=e=>{cy.layout({name:e.target.value,animate:true,padding:40,
 nodeRepulsion:9000,idealEdgeLength:90}).run();};
document.getElementById('legend').innerHTML=types.map(t=>`<span class="chip" data-t="${esc(t)}"><span class="dot" style="background:${color[t]}"></span>${esc(t)} (${NODES.filter(n=>n.type===t).length})</span>`).join('');
document.querySelectorAll('#legend .chip').forEach(ch=>ch.onclick=()=>{const t=ch.getAttribute('data-t');
 if(off.has(t)){off.delete(t);ch.classList.remove('off');}else{off.add(t);ch.classList.add('off');}applyFilter();});
document.getElementById('layout').value='cose';
const Q=new URLSearchParams(location.search),QL=Q.get('layout'),QS=Q.get('select');
if(QL&&[...document.querySelectorAll('#layout option')].some(o=>o.value===QL)){document.getElementById('layout').value=QL;cy.layout({name:QL,animate:false,padding:40,nodeRepulsion:9000,idealEdgeLength:90}).run();}
function fromHash(){try{const h=decodeURIComponent((location.hash||'').slice(1));if(h&&byId[h])select(h);}catch(e){}}
addEventListener('hashchange',fromHash);
if(QS&&byId[QS])select(QS);else fromHash();
</script></body></html>
